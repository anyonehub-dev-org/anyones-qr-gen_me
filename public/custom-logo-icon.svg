<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="ringGradIcon" x1="85%" y1="15%" x2="15%" y2="85%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="65%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="handGradIcon" x1="10%" y1="30%" x2="90%" y2="70%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#093d59" />
    </linearGradient>

    <linearGradient id="handHighlightIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="qrCyanGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>

    <linearGradient id="finderBlueGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="qrLavenderGradIcon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <rect width="500" height="500" rx="90" fill="#090c14" />

  <g transform="translate(-150, -85)">
    <!-- QR Code Central Card Plaque -->
    <rect x="255" y="195" width="290" height="290" rx="16" fill="#0d131f" stroke="#1e293b" stroke-width="2" opacity="0.9" />

    <!-- Top-Left Finder Eye (Blue Center) -->
    <g transform="translate(270, 210)">
      <rect x="0" y="0" width="76" height="76" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="7" />
      <rect x="18" y="18" width="40" height="40" rx="4" fill="url(#finderBlueGradIcon)" />
    </g>

    <!-- Top-Right Finder Eye (Lavender Center) -->
    <g transform="translate(454, 210)">
      <rect x="0" y="0" width="76" height="76" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="7" />
      <rect x="18" y="18" width="40" height="40" rx="4" fill="url(#qrLavenderGradIcon)" />
    </g>

    <!-- Bottom-Left Finder Eye -->
    <g transform="translate(270, 394)">
      <rect x="0" y="0" width="76" height="76" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="7" />
      <rect x="18" y="18" width="40" height="40" rx="4" fill="url(#finderBlueGradIcon)" />
    </g>

    <!-- Matrix Blocks -->
    <g fill="url(#qrCyanGradIcon)">
      <rect x="360" y="215" width="16" height="34" rx="4" />
      <rect x="390" y="215" width="32" height="16" rx="4" />
      <rect x="430" y="215" width="14" height="28" rx="3" />
      <rect x="360" y="260" width="28" height="16" rx="4" />
      <rect x="400" y="245" width="18" height="40" rx="4" />
      <rect x="270" y="300" width="24" height="16" rx="4" />
      <rect x="305" y="300" width="36" height="16" rx="4" />
      <rect x="355" y="290" width="18" height="30" rx="4" />
      <rect x="385" y="295" width="34" height="18" rx="4" />
      <rect x="430" y="285" width="18" height="38" rx="4" />
      <rect x="460" y="300" width="30" height="18" rx="4" />
      <rect x="500" y="295" width="30" height="18" rx="4" />
      <rect x="270" y="330" width="18" height="42" rx="4" />
      <rect x="300" y="330" width="44" height="16" rx="4" />
      <rect x="355" y="335" width="20" height="40" rx="4" />
      <rect x="385" y="325" width="18" height="32" rx="4" />
      <rect x="415" y="335" width="32" height="18" rx="4" />
      <rect x="460" y="330" width="18" height="36" rx="4" />
      <rect x="490" y="325" width="40" height="18" rx="4" />
      <rect x="300" y="360" width="36" height="18" rx="4" />
      <rect x="385" y="370" width="42" height="18" rx="4" />
      <rect x="500" y="355" width="28" height="32" rx="4" />
      <rect x="360" y="400" width="18" height="50" rx="4" />
      <rect x="390" y="405" width="36" height="18" rx="4" />
      <rect x="390" y="435" width="42" height="18" rx="4" />
      <rect x="500" y="400" width="30" height="45" rx="4" />
    </g>

    <g fill="url(#qrLavenderGradIcon)">
      <rect x="380" y="240" width="16" height="16" rx="3" />
      <rect x="430" y="335" width="18" height="18" rx="4" />
      <rect x="360" y="365" width="16" height="24" rx="4" />
      <rect x="445" y="440" width="38" height="16" rx="4" />
    </g>

    <!-- Ring Arc -->
    <path d="M 370 148 C 380 148, 385 148, 385 158 C 385 168, 380 172, 368 172 C 300 176, 230 220, 196 288 C 172 336, 172 388, 185 435 C 190 452, 198 470, 208 488" 
          fill="none" stroke="url(#ringGradIcon)" stroke-width="26" stroke-linecap="round" />

    <path d="M 425 156 C 420 156, 415 156, 415 166 C 415 174, 420 178, 430 178 C 515 186, 588 248, 612 332 C 632 400, 616 476, 568 535" 
          fill="none" stroke="url(#ringGradIcon)" stroke-width="26" stroke-linecap="round" />

    <!-- Hand -->
    <path d="M 210 475 C 230 525, 275 575, 335 605 C 410 642, 490 635, 555 585 C 585 560, 608 525, 620 488 C 625 472, 612 460, 595 466 C 582 470, 570 485, 558 502 C 525 545, 470 568, 415 560 C 365 552, 318 528, 280 490 C 270 480, 255 480, 245 490 Z" 
          fill="url(#handGradIcon)" />

    <path d="M 270 485 C 320 545, 395 565, 470 550 C 515 540, 550 515, 570 485 C 578 474, 568 460, 554 466 C 520 485, 478 495, 438 490 C 378 485, 325 450, 292 410 C 285 400, 268 405, 265 418 C 260 440, 262 465, 270 485 Z" 
          fill="url(#handHighlightIcon)" />

    <path d="M 378 518 C 430 528, 482 510, 524 476 C 532 470, 526 458, 516 462 C 480 478, 440 482, 400 476 C 378 472, 365 488, 378 518 Z" 
          fill="#00f2fe" opacity="0.85" />
  </g>
</svg>
