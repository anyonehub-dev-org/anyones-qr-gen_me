<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="100%" height="100%">
  <defs>
    <!-- Dark Textured Background -->
    <radialGradient id="bgVignette" cx="50%" cy="45%" r="70%">
      <stop offset="0%" stop-color="#151924" />
      <stop offset="50%" stop-color="#0c0e15" />
      <stop offset="100%" stop-color="#050608" />
    </radialGradient>

    <!-- Fine Carbon Fiber Texture Pattern -->
    <pattern id="carbonMesh" width="8" height="8" patternUnits="userSpaceOnUse">
      <path d="M0 4 L4 0 L8 4 L4 8 Z" fill="#1b2130" opacity="0.25" />
      <circle cx="4" cy="4" r="1" fill="#000000" opacity="0.4" />
    </pattern>

    <!-- Glow Filters -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="18" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softAmbient" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="35" result="blur" />
    </filter>

    <!-- 3D Tubular Ring Gradients -->
    <!-- Purple Arc (Top Right) -->
    <linearGradient id="purpleRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8b4fe" />
      <stop offset="25%" stop-color="#c084fc" />
      <stop offset="65%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>

    <!-- Cyan/Teal Arc (Left) -->
    <linearGradient id="tealRingGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="45%" stop-color="#00f2fe" />
      <stop offset="85%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <!-- Hand Gradients -->
    <linearGradient id="handBodyGrad" x1="0%" y1="40%" x2="100%" y2="60%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="40%" stop-color="#0891b2" />
      <stop offset="80%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#155e75" />
    </linearGradient>

    <linearGradient id="handHighlightGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0.1" />
    </linearGradient>

    <!-- Finder Eye Gradients -->
    <linearGradient id="eyeBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="eyeLavenderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="eyePurpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>

    <!-- QR Data Dots Gradient -->
    <linearGradient id="qrMintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6ee7b7" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#00f2fe" />
    </linearGradient>
  </defs>

  <!-- 1. Background Surface with Mesh Texture -->
  <rect width="1000" height="1000" rx="44" fill="url(#bgVignette)" />
  <rect width="1000" height="1000" rx="44" fill="url(#carbonMesh)" />

  <!-- 2. Ambient Colored Backlights -->
  <circle cx="500" cy="420" r="260" fill="#00f2fe" opacity="0.08" filter="url(#softAmbient)" />
  <circle cx="580" cy="340" r="220" fill="#9333ea" opacity="0.1" filter="url(#softAmbient)" />

  <!-- 3. Central Artwork Container -->
  <g transform="translate(0, -15)">
    <!-- Thin Blueprint Grid Lines -->
    <g opacity="0.16" stroke="#38bdf8" stroke-width="1.4">
      <line x1="330" y1="270" x2="670" y2="270" />
      <line x1="330" y1="340" x2="670" y2="340" />
      <line x1="330" y1="410" x2="670" y2="410" />
      <line x1="330" y1="480" x2="670" y2="480" />
      <line x1="330" y1="550" x2="670" y2="550" />

      <line x1="345" y1="255" x2="345" y2="565" />
      <line x1="422" y1="255" x2="422" y2="565" />
      <line x1="500" y1="255" x2="500" y2="565" />
      <line x1="578" y1="255" x2="578" y2="565" />
      <line x1="655" y1="255" x2="655" y2="565" />
    </g>

    <!-- Central Plaque Plate for QR -->
    <rect x="325" y="250" width="350" height="350" rx="20" fill="#0b0f19" stroke="#1e293b" stroke-width="2.5" opacity="0.88" />

    <!-- Corner Finder Patterns -->
    <!-- Top-Left Finder Eye (Sky Blue) -->
    <g transform="translate(345, 270)">
      <rect x="0" y="0" width="92" height="92" rx="10" fill="#131b2c" stroke="#38bdf8" stroke-width="8" />
      <rect x="22" y="22" width="48" height="48" rx="6" fill="url(#eyeBlueGrad)" />
    </g>

    <!-- Top-Right Finder Eye (Lavender Purple) -->
    <g transform="translate(563, 270)">
      <rect x="0" y="0" width="92" height="92" rx="10" fill="#18192d" stroke="#a78bfa" stroke-width="8" />
      <rect x="22" y="22" width="48" height="48" rx="6" fill="url(#eyeLavenderGrad)" />
    </g>

    <!-- Bottom-Left Finder Eye (Violet / Indigo) -->
    <g transform="translate(345, 488)">
      <rect x="0" y="0" width="92" height="92" rx="10" fill="#151b2c" stroke="#38bdf8" stroke-width="8" />
      <rect x="22" y="22" width="48" height="48" rx="6" fill="url(#eyePurpleGrad)" />
    </g>

    <!-- Internal Small Alignment Square -->
    <g transform="translate(540, 465)">
      <rect x="0" y="0" width="56" height="56" rx="8" fill="#121828" stroke="#38bdf8" stroke-width="6" />
      <rect x="16" y="16" width="24" height="24" rx="4" fill="#00f2fe" />
    </g>

    <!-- Cybernetic QR Matrix Blocks (Mint & Cyan) -->
    <g fill="url(#qrMintGrad)">
      <!-- Top Middle Matrix -->
      <rect x="455" y="275" width="20" height="42" rx="5" />
      <rect x="490" y="275" width="38" height="20" rx="5" />
      <rect x="532" y="275" width="18" height="34" rx="4" />
      <rect x="455" y="330" width="34" height="20" rx="5" />
      <rect x="502" y="312" width="22" height="48" rx="5" />

      <!-- Center Matrix Zone -->
      <rect x="345" y="378" width="30" height="20" rx="5" />
      <rect x="390" y="378" width="45" height="20" rx="5" />
      <rect x="450" y="365" width="22" height="38" rx="5" />
      <rect x="488" y="372" width="42" height="22" rx="5" />
      <rect x="542" y="360" width="22" height="46" rx="5" />
      <rect x="578" y="378" width="38" height="22" rx="5" />
      <rect x="628" y="372" width="38" height="22" rx="5" />

      <!-- Lower Matrix Zone -->
      <rect x="345" y="415" width="22" height="52" rx="5" />
      <rect x="382" y="415" width="55" height="20" rx="5" />
      <rect x="450" y="420" width="25" height="50" rx="5" />
      <rect x="488" y="408" width="22" height="40" rx="5" />
      <rect x="525" y="420" width="40" height="22" rx="5" />
      <rect x="578" y="415" width="22" height="45" rx="5" />
      <rect x="615" y="408" width="50" height="22" rx="5" />

      <rect x="382" y="452" width="45" height="22" rx="5" />
      <rect x="488" y="465" width="52" height="22" rx="5" />
      <rect x="628" y="445" width="35" height="40" rx="5" />

      <!-- Bottom Matrix Row -->
      <rect x="455" y="502" width="22" height="62" rx="5" />
      <rect x="492" y="508" width="45" height="22" rx="5" />
      <rect x="492" y="545" width="52" height="22" rx="5" />
      <rect x="628" y="502" width="38" height="56" rx="5" />
    </g>

    <!-- Accent Violet & Purple Micro-Modules -->
    <g fill="#c084fc">
      <rect x="480" y="305" width="20" height="20" rx="4" />
      <rect x="542" y="420" width="22" height="22" rx="5" />
      <rect x="455" y="458" width="20" height="30" rx="5" />
      <rect x="560" y="552" width="48" height="20" rx="5" />
    </g>

    <!-- 4. Tubular 3D Circular Ring Frame -->
    <!-- Top-Left Cyan Arc -->
    <path d="M 465 195 
             C 475 195, 480 195, 480 207 
             C 480 219, 475 224, 460 224 
             C 375 228, 288 285, 245 370 
             C 215 430, 215 495, 232 555 
             C 238 575, 248 598, 260 620" 
          fill="none" stroke="url(#tealRingGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Top-Right Purple Arc -->
    <path d="M 535 204 
             C 530 204, 524 204, 524 216 
             C 524 226, 530 231, 542 231 
             C 648 241, 740 318, 770 422 
             C 795 508, 775 602, 715 678" 
          fill="none" stroke="url(#purpleRingGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Soft Purple Glow Overlay on Upper Right Arc -->
    <path d="M 535 204 
             C 605 212, 685 258, 738 325 
             C 785 385, 805 465, 792 548" 
          fill="none" stroke="#c084fc" stroke-width="14" stroke-linecap="round" opacity="0.45" filter="url(#neonGlow)" />

    <!-- 5. Sleek Teal Hand (Cradling the Base of the Ring) -->
    <!-- Outer Hand Contour -->
    <path d="M 262 605 
             C 288 668, 345 730, 420 768 
             C 515 815, 615 806, 698 744 
             C 735 712, 764 668, 778 622 
             C 784 602, 768 586, 747 594 
             C 730 600, 715 618, 700 640 
             C 658 694, 590 722, 520 712 
             C 458 702, 398 672, 350 624 
             C 338 612, 318 612, 306 624 
             Z" 
          fill="url(#handBodyGrad)" />

    <!-- Hand Palm & Thumb Highlight Sweep -->
    <path d="M 338 618 
             C 400 694, 495 718, 590 700 
             C 646 688, 690 656, 715 618 
             C 725 604, 712 586, 695 594 
             C 652 618, 600 630, 550 624 
             C 475 618, 408 574, 366 524 
             C 358 512, 336 518, 332 534 
             C 326 562, 328 593, 338 618 
             Z" 
          fill="url(#handHighlightGrad)" />

    <!-- Inner Thumb Line Gesture -->
    <path d="M 474 660 
             C 538 672, 604 650, 656 606 
             C 666 598, 658 584, 646 588 
             C 600 608, 550 614, 500 606 
             C 474 602, 458 622, 474 660 
             Z" 
          fill="#00f2fe" opacity="0.88" />
  </g>

  <!-- 6. Bold Modern Typography -->
  <g transform="translate(500, 850)">
    <!-- Main Headline: anyones-QR gen -->
    <text x="0" y="0" text-anchor="middle" font-family="'Space Grotesk', 'Plus Jakarta Sans', system-ui, sans-serif" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-0.025em">
      anyones-QR gen
    </text>

    <!-- Subtitle: Truly Free | Open | Customizable QR Codes -->
    <text x="0" y="55" text-anchor="middle" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="28" font-weight="500" fill="#cbd5e1" letter-spacing="0.04em">
      Truly Free <tspan fill="#38bdf8" font-weight="700">|</tspan> Open <tspan fill="#38bdf8" font-weight="700">|</tspan> Customizable QR Codes
    </text>
  </g>

  <!-- 7. Sparkling 4-Point Accent Star (Bottom Right) -->
  <g transform="translate(885, 908)" filter="url(#neonGlow)">
    <path d="M 0 -22 Q 0 0 22 0 Q 0 0 0 22 Q 0 0 -22 0 Q 0 0 0 -22 Z" fill="#94a3b8" opacity="0.85" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
  </g>
</svg>
